<style>
/* Layout: tek sütunlu okuma listesi; üstte yapışkan filtre çubuğu, gün gün gruplanmış makaleler */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #18202b;
  --muted: #5b6776;
  --line: #dde3ea;
  --accent: #1d5c78;
  --accent-soft: #e2eef3;
  --new: #b4541b;
  --j-bja: #7a3e8e; --j-brs: #1f7a5a; --j-bp: #a33b3b; --j-jamap: #22578f; --j-jad: #8a6a12;
  --j-cnni: #b0406f; --j-lanpsy: #0f6e7a; --j-ipg: #5a5fb0; --j-bd: #6d7a1c;
  --font-title: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #19202a; --ink: #e6ebf1; --muted: #9aa6b4; --line: #2a3441;
    --accent: #7cc0dc; --accent-soft: #1d3340; --new: #f0a36b;

    --j-cnni: #ee9cc0; --j-lanpsy: #72d0da; --j-ipg: #a9adf0; --j-bd: #c3d27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19202a; --ink: #e6ebf1; --muted: #9aa6b4; --line: #2a3441;
  --accent: #7cc0dc; --accent-soft: #1d3340; --new: #f0a36b;

    --j-cnni: #ee9cc0; --j-lanpsy: #72d0da; --j-ipg: #a9adf0; --j-bd: #c3d27a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-ui); }
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }

header.top { padding-block: calc(20px + env(safe-area-inset-top, 0px)) 8px; }
header.top h1 { font: 600 1.6rem/1.2 var(--font-title); margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
.meta strong { color: var(--new); font-weight: 600; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);

.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; font: 500 0.82rem var(--font-ui); color: var(--muted); padding: 6px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
  font: 500 0.78rem var(--font-ui); padding: 4px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.toggle { margin-left: auto; font-size: 0.82rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
#q { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 7px 10px; font: 0.9rem var(--font-ui); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 8px 48px; }
.day { margin-top: 22px; }
.day h2 { font: 600 0.78rem var(--font-ui); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
  margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.day h2 .count { font-weight: 500; letter-spacing: 0; text-transform: none; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
article { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
article + article { border-top: 1px solid var(--line); }
.head { display: flex; gap: 8px; align-items: center; font-size: 0.74rem; color: var(--muted); flex-wrap: wrap; }
.jn { font-weight: 600; color: var(--c); text-transform: uppercase; letter-spacing: 0.05em; }
article h3 { margin: 0; font: 600 1.06rem/1.35 var(--font-title); text-wrap: pretty; overflow-wrap: anywhere; }
article h3 a { color: var(--ink); text-decoration: none; }
article h3 a:hover { color: var(--accent); text-decoration: underline; }
.authors { font-size: 0.8rem; color: var(--muted); }
.ozet { margin: 2px 0 0; font-size: 0.92rem; }
.ozet.none { color: var(--muted); font-style: italic; }
.actions { display: flex; gap: 14px; font-size: 0.8rem; }
.actions a, .actions button { color: var(--accent); background: none; border: 0; padding: 0; font: 500 0.8rem var(--font-ui); cursor: pointer; text-decoration: none; }
article.read { opacity: 0.5; }
article.read .mark::before { content: "✓ "; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
footer { color: var(--muted); font-size: 0.78rem; padding-block: 0 40px; display: flex; flex-direction: column; gap: 4px; }
footer a { color: var(--muted); }
@media (max-width: 480px) {
  .toggle { margin-left: 0; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .chips .chip { flex: none; }
}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const J = Object.fromEntries(DATA.journals.map(j => [j.id, j]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const read = new Set(store.get("dt-read", []));
const state = Object.assign({ range: "last", unread: false, off: [] }, store.get("dt-view", {}));
state.q = "";
const lastAdded = DATA.articles.length ? DATA.articles[0].added : null;

const fmtDay = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", weekday: "long" });
const fmtShort = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "short" });
const d = s => new Date(s + "T12:00:00");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => (s || "").toLocaleLowerCase("tr-TR");

function inRange(a) {
  if (state.range === "last") return a.added === lastAdded;
  if (state.range === "all") return true;
  const cut = new Date(); cut.setDate(cut.getDate() - Number(state.range));
  return d(a.added) >= cut;
}

function render() {
  store.set("dt-view", { range: state.range, unread: state.unread, off: state.off });
  document.querySelectorAll("#range button").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === state.range));
  document.getElementById("unread").checked = state.unread;

  const base = DATA.articles.filter(a => inRange(a) && (!state.unread || !read.has(a.doi)));
  const q = norm(state.q.trim());
  const match = a => !q || norm(a.title + " " + a.ozet + " " + a.authors).includes(q);

  document.getElementById("chips").innerHTML = DATA.journals.map(j => {
    const n = base.filter(a => a.journal === j.id && match(a)).length;
    return `<button class="chip" style="--c:var(--j-${j.id}, var(--accent))" data-j="${j.id}" aria-pressed="${!state.off.includes(j.id)}">
      <span class="dot"></span>${esc(j.name)} <span class="n">${n}</span></button>`;
  }).join("");

  const shown = base.filter(a => !state.off.includes(a.journal) && match(a));
  const days = {};
  shown.forEach(a => (days[a.added] = days[a.added] || []).push(a));

  const main = document.getElementById("main");
  if (!shown.length) {
    main.innerHTML = `<p class="empty">${state.unread ? "Bu aralıkta okunmamış makale kalmadı." : "Bu filtrelerle eşleşen makale yok."}</p>`;
    return;
  }
  main.innerHTML = Object.keys(days).sort().reverse().map(day => `
    <section class="day">
      <h2>${esc(fmtDay.format(d(day)))} <span class="count">· ${days[day].length} makale</span></h2>
      <div class="list">${days[day].map(card).join("")}</div>
    </section>`).join("");
}

function card(a) {
  const j = J[a.journal] || { name: a.journal };
  const isRead = read.has(a.doi);
  return `<article class="${isRead ? "read" : ""}" data-doi="${esc(a.doi)}" style="--c:var(--j-${a.journal}, var(--accent))">
    <div class="head"><span class="jn" lang="en">${esc(j.name)}</span><span>online ${esc(fmtShort.format(d(a.online)))}</span></div>
    <h3><a href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener">${esc(a.title)}</a></h3>
    ${a.authors ? `<div class="authors">${esc(a.authors)}</div>` : ""}
    <p class="ozet ${a.ozet ? "" : "none"}">${a.ozet ? esc(a.ozet) : "Türkçe özet henüz yok."}</p>
    <div class="actions">
      <button class="mark" type="button">${isRead ? "Okundu" : "Okundu işaretle"}</button>
      ${a.pmid ? `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(a.pmid)}/" target="_blank" rel="noopener">PubMed</a>` : ""}
    </div>
  </article>`;
}

document.getElementById("range").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.range = b.dataset.r; render();
});
document.getElementById("unread").addEventListener("change", e => { state.unread = e.target.checked; render(); });
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const id = b.dataset.j;
  state.off = state.off.includes(id) ? state.off.filter(x => x !== id) : [...state.off, id];
  render();
});
document.getElementById("main").addEventListener("click", e => {
  const art = e.target.closest("article"); if (!art) return;
  const doi = art.dataset.doi;
  if (e.target.closest(".mark")) {
    read.has(doi) ? read.delete(doi) : read.add(doi);
  } else if (e.target.closest("h3 a")) {
    read.add(doi);
  } else return;
  const keep = new Set(DATA.articles.map(a => a.doi));
  store.set("dt-read", [...read].filter(x => keep.has(x)));
  if (!state.unread) {
    const isRead = read.has(doi);
    art.classList.toggle("read", isRead);
    art.querySelector(".mark").textContent = isRead ? "Okundu" : "Okundu işaretle";
  } else setTimeout(render, 250);
});

(function meta() {
  const upd = new Date(DATA.updated);
  const t = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Istanbul" }).format(upd);
  const n = DATA.articles.filter(a => a.added === lastAdded).length;
  document.getElementById("meta").innerHTML = `Son güncelleme ${esc(t)} · son taramada <strong>${n} yeni makale</strong>`;
  document.getElementById("foot").innerHTML = "<div>Dergi sayfaları:</div>" +
    DATA.journals.map(j => `<a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.name)}</a>`).join("");
})();
render();
</script>
</body>
</html>
